# CLEAN fixture — must be silent under problem-details.yaml.
#
# Carries `urn:ietf:rfc:7807` on purpose. RFC 9457 Appendix B retained that XML
# namespace for backward compatibility, so it is correct and must NOT be
# flagged by problem-details-cites-obsoleted-rfc7807. If that rule ever starts
# firing here, the regex has over-matched.

openapi: 3.1.0
info:
  title: Clean Problem Details API
  description: >-
    A minimal API whose error responses conform to RFC 9457, Problem Details for
    HTTP APIs.
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0

externalDocs:
  description: Problem Details for HTTP APIs
  url: https://www.rfc-editor.org/rfc/rfc9457

servers:
  - url: https://api.example.com

paths:
  /widgets/{widgetId}:
    get:
      summary: Get a widget
      operationId: getWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The widget.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  schemas:

    Problem:
      type: object
      description: >-
        A problem detail object, per RFC 9457 Section 3.1. Extension members are
        permitted — additionalProperties is deliberately left unset.
      xml:
        name: problem
        namespace: urn:ietf:rfc:7807
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          example: https://example.com/probs/out-of-credit
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: You do not have enough credit.
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
          example: 403
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          example: Your current balance is 30, but that costs 50.
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
          example: /account/12345/msgs/abc

  headers:

    WWW-Authenticate:
      description: The authentication scheme the client should use.
      schema:
        type: string
        examples:
          - 'Bearer realm="example", error="invalid_token"'

    Retry-After:
      description: Seconds the client should wait before retrying.
      schema:
        type: string
        examples:
          - '120'

  responses:

    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://example.com/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: The access token is missing or expired.
            instance: /widgets/42

    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No widget exists with that identifier.
            instance: /widgets/42

    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://example.com/errors/too-many-requests
            title: Too Many Requests
            status: 429
            detail: You have exceeded the rate limit for this endpoint.
            instance: /widgets/42

    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://example.com/errors/internal-server-error
            title: Internal Server Error
            status: 500
            detail: The request could not be completed. Please retry.
            instance: /widgets/42
